<script>
document.querySelectorAll('.chip').forEach(function(c){var sx,sy,ox,oy,moved=false,down=false;
c.addEventListener('pointerdown',function(e){down=true;moved=false;sx=e.clientX;sy=e.clientY;var st=c.parentNode.getBoundingClientRect(),r=c.getBoundingClientRect();ox=r.left-st.left;oy=r.top-st.top;c.setPointerCapture(e.pointerId)});
c.addEventListener('pointermove',function(e){if(!down)return;var dx=e.clientX-sx,dy=e.clientY-sy;if(!moved&&Math.abs(dx)+Math.abs(dy)<5)return;moved=true;c.classList.add('drag');c.style.right='auto';c.style.bottom='auto';c.style.left=(ox+dx)+'px';c.style.top=(oy+dy)+'px'});
c.addEventListener('pointerup',function(){down=false;c.classList.remove('drag')});
c.addEventListener('click',function(e){if(moved){e.preventDefault();moved=false}});});
</script>
